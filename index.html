<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" charset="utf-8">
    <title>Todo App</title>
  </head>

  <body>
    <header class="header">
      <img src="./eisenhower-matrix.jpg" class="header-image">
      <a href="https://goal-life.com/page/method/matrix-eisenhower" class="header-link">Want more details?</a>
    </header>
    <main class="main-content">
      <p class="main-text"></p>
      <label for="new-task" class="title-label">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="task task-row-wrapper__input" type="text">
          <button class="btn-task__add">Add</button>
        </div>
      <h3 class="title-label">Todo</h3>
      <ul class="tasks incomplete-tasks">
        <li class="tasks__list">
          <label  class="task tasks__label">
            <input type="checkbox" class="tasks__checkbox">
            Pay Bills
          </label>
          <input type="text" class="task tasks__input">
          <button class="edit tasks__edit-btn">Edit</button>
          <button class="delete tasks__delete-btn">
            <img src="./remove.svg" class="tasks__img">
          </button>
        </li>
        <li class="tasks__list">
          <label  class="task tasks__label">
            <input type="checkbox" class="tasks__checkbox">
            Go Shopping
          </label>
          <input type="text" value="Go Shopping" class="task tasks__input">
          <button class="edit tasks__btn-edit">Save</button>
          <button class="delete tasks__btn-delete">
            <img src="./remove.svg" class="tasks__img">
          </button>
        </li>
      </ul>
        <h3 class="title-label">Completed</h3>
        <ul class="tasks completed-tasks">
          <li class="tasks__list">
            <label class="task tasks__label">
              <input type="checkbox" class="tasks__checkbox" checked>
              See the Doctor
            </label>
            <input type="text" class="task tasks__input">
            <button class="edit tasks__btn-edit">Edit</button>
            <button class="delete tasks__btn-delete">
              <img src="./remove.svg" class="tasks__img">
            </button>
          </li>
        </ul>
      </main>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
